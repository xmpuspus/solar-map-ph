[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-map-ph"
version = "1.2.0"
description = "Open-source rooftop solar detection from public satellite imagery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xavier Puspus" }]
keywords = ["rooftop-solar", "satellite-imagery", "remote-sensing", "CLIP", "civic-tech"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy==1.26.4",
  "scikit-learn==1.9.0",
  "joblib==1.5.3",
  "pillow==11.3.0",
  "requests==2.32.5",
]

[project.optional-dependencies]
ml = [
  "torch==2.12.0",
  "transformers==5.10.2",
  "huggingface-hub==1.18.0",
  "safetensors==0.7.0",
  "tokenizers==0.23.1",
]
plots = [
  "matplotlib>=3.8",
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
sam = [
  "segment-anything==1.0",
]
all = [
  "solar-map-ph[ml,plots,test,sam]",
]

[project.urls]
Homepage = "https://github.com/xmpuspus/solar-map-ph"
Documentation = "https://github.com/xmpuspus/solar-map-ph/blob/main/MODEL_CARD.md"
Issues = "https://github.com/xmpuspus/solar-map-ph/issues"
Repository = "https://github.com/xmpuspus/solar-map-ph"
Changelog = "https://github.com/xmpuspus/solar-map-ph/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["solar_map_ph"]

[tool.setuptools.package-data]
solar_map_ph = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "PERF", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Research and data-pipeline scripts: tolerate stylistic nits in one-off scripts
# that pytest already covers via the classifier smoke test and grid math tests.
# PERF and RUF rules are useful in library code but noisy in research scripts.
"detection/**" = ["B007", "B023", "B905", "E402", "F841", "PERF401", "PERF102", "RUF001", "RUF005", "RUF015", "RUF017", "RUF046", "RUF059"]
"pipeline/**" = ["B007", "B023", "B905", "E402", "F841", "PERF401", "PERF102", "RUF001", "RUF005", "RUF015", "RUF017", "RUF046", "RUF059"]
"scripts/**" = ["B905", "PERF401", "RUF059"]
"examples/**" = ["B905", "PERF401", "RUF059"]
"site/scripts/**" = ["B905", "PERF401", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
