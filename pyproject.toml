[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-watts"
version = "1.0.0"
description = "Open-source rooftop solar detection from public satellite imagery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xavier Puspus" }]
keywords = ["rooftop-solar", "satellite-imagery", "remote-sensing", "CLIP", "civic-tech"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy==1.26.4",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
  "pillow==11.3.0",
  "requests==2.32.5",
]

[project.optional-dependencies]
ml = [
  "torch==2.9.1",
  "transformers==4.57.3",
  "huggingface-hub==0.36.0",
  "safetensors==0.7.0",
  "tokenizers==0.22.2",
]
plots = [
  "matplotlib>=3.8",
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
sam = [
  "segment-anything==1.0",
]
all = [
  "ghost-watts[ml,plots,test,sam]",
]

[project.urls]
Homepage = "https://github.com/xmpuspus/ghost-watts"
Documentation = "https://github.com/xmpuspus/ghost-watts/blob/main/MODEL_CARD.md"
Issues = "https://github.com/xmpuspus/ghost-watts/issues"
Repository = "https://github.com/xmpuspus/ghost-watts"
Changelog = "https://github.com/xmpuspus/ghost-watts/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["ghost_watts"]

[tool.setuptools.package-data]
ghost_watts = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "PERF", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
