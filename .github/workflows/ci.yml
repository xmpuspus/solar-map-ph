name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  site:
    name: site (astro)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  pipeline:
    name: pipeline (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Compile-check
        run: python -m py_compile pipeline.py validate.py scrape_meralco.py

      - name: JSON validation
        run: |
          for f in *.json; do python -c "import json; json.load(open('$f'))"; done

      - name: Pipeline dry-run
        run: python pipeline.py --quarter 2026Q2 --baseline 2022 --dry-run

      - name: Validate dry-run output
        run: |
          python -c "
          import json
          fc = json.load(open('../site/public/data/solar_map_ph_2026Q2.geojson'))
          assert fc['type'] == 'FeatureCollection'
          assert fc['properties']['quarter'] == '2026Q2'
          assert len(fc['features']) >= 1, 'no features in dry-run output'
          for f in fc['features']:
              for k in ('city', 'province', 'composite'):
                  assert k in f['properties'], f'missing {k} in feature properties'
              c = f['properties']['composite']
              assert c is None or 0 <= c <= 1, f'composite out of [0,1]: {c}'
          print('OK: dry-run output valid')
          "

  detection-hash:
    name: detection (deterministic hash)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Verify dataset_v4.npz is present
        run: |
          test -f detection/train/dataset_v4.npz
          ls -la detection/train/dataset_v4.npz

      - name: Train clf_v4 from cached dataset
        run: make train

      - name: Verify deterministic classifier hash
        run: make hash-verify

      - name: Smoke-test the detection package import surface
        run: python -c "import solar_map_ph; print('solar_map_ph version', solar_map_ph.__version__)"

  detection-tests:
    name: detection (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: pytest tests/ -q
