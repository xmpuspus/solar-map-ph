name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  site:
    name: site (astro)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  pipeline:
    name: pipeline (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Compile-check
        run: python -m py_compile pipeline.py validate.py scrape_meralco.py

      - name: JSON validation
        run: |
          for f in *.json; do python -c "import json; json.load(open('$f'))"; done

      - name: Pipeline dry-run (to /tmp, leaves committed output untouched)
        run: |
          python pipeline.py --quarter 2026Q2 --baseline 2022 --dry-run
          # Dry-run writes a 0-feature stub with dry_run=true. The committed
          # production GeoJSON has 61 features. We don't want CI to overwrite
          # it, so checkout-restore after the dry-run.
          git checkout -- ../site/public/data/solar_map_ph_2026Q2.geojson || true

      - name: Validate committed production GeoJSON
        run: |
          python -c "
          import json
          fc = json.load(open('../site/public/data/solar_map_ph_2026Q2.geojson'))
          assert fc['type'] == 'FeatureCollection'
          assert fc['properties']['quarter'] == '2026Q2'
          assert len(fc['features']) >= 1, 'no features in committed output'
          for f in fc['features']:
              for k in ('name', 'province', 'metrics'):
                  assert k in f['properties'], f'missing {k} in feature properties'
          print('OK: committed GeoJSON valid (' + str(len(fc['features'])) + ' features)')
          "

  detection-hash:
    name: detection (deterministic hash)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Verify dataset_v4.npz is present
        run: |
          test -f detection/train/dataset_v4.npz
          ls -la detection/train/dataset_v4.npz

      - name: Touch trained artifacts so make doesn't try to rebuild
        run: |
          # `actions/checkout` normalizes file mtimes to the checkout time,
          # which makes `make` think the trained .joblib is older than its
          # source dataset and tries to retrain. That rebuild needs Torchvision
          # + network tiles (build_dataset_v5.py loads CLIP), which CI lacks.
          # `hash-verify` now checks clf_v5 (v1.2), so touch the full v5
          # dependency chain in order so each target is newer than its
          # prerequisites; `make hash-verify` then just runs the sha256 check.
          touch detection/train/dataset_v4.npz
          touch detection/train/dataset_v4_manifest.json
          touch detection/train/region_labels.jsonl
          touch detection/train/dataset_v5.npz
          touch detection/train/dataset_v5_manifest.json
          touch detection/train/v5_region_holdout/holdout_split.json
          touch detection/train/clf_v5.joblib
          touch detection/train/clf_v5_metrics.json

      - name: Verify deterministic classifier hash
        run: make hash-verify

      - name: Smoke-test the detection package import surface
        run: python -c "import solar_map_ph; print('solar_map_ph version', solar_map_ph.__version__)"

  detection-tests:
    name: detection (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: pytest tests/ -q
